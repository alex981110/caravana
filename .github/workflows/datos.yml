name: Actualizar datos

# Cada lunes descarga de OpenStreetMap los sitios para autocaravanas y los registros
# oficiales de campings y, si hay cambios, actualiza data/. También se puede lanzar
# a mano desde «Actions».
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar y procesar datos
        run: node scripts/build-data.mjs

      - name: Guardar si hay cambios
        run: |
          if git diff --quiet -- data/; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Datos: actualización semanal (OpenStreetMap y registros oficiales)"
          git push
