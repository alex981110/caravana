<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caravana · ¿Dónde dormimos esta noche?</title>
  <meta name="description" content="Mapa de áreas de autocaravanas, parkings, campings y puntos de vaciado en toda España, con servicios, horarios y cómo llegar. Datos de OpenStreetMap.">
  <meta name="theme-color" content="#F2784B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F2784B'/%3E%3Cpath d='M6 21v-8a3 3 0 0 1 3-3h11l6 5v6z' fill='%23FFF6E8'/%3E%3Ccircle cx='11' cy='22' r='2.6' fill='%232B3A55'/%3E%3Ccircle cx='21' cy='22' r='2.6' fill='%232B3A55'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="roadtrip">
  <header class="hero">
    <!-- Paisaje de la cabecera: sol, montañas y carretera (solo en el estilo road trip) -->
    <svg class="hero-landscape" viewBox="0 0 1440 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g transform="translate(0 42)">
      <circle class="sun" cx="1180" cy="130" r="58"/>
      <path class="ridge-far" d="M0 150 L120 104 L210 132 L330 78 L450 128 L560 92 L690 140 L810 86 L930 132 L1050 96 L1180 140 L1300 100 L1440 132 V220 H0Z"/>
      <path class="ridge-near" d="M0 186 L150 140 L260 170 L390 128 L520 176 L660 146 L800 182 L940 140 L1090 178 L1230 150 L1440 184 V220 H0Z"/>
      </g>
      <path class="road" d="M0 212 C 360 196, 720 206, 1440 196 V220 H0Z"/>
    </svg>

    <div class="hero-inner">
      <a class="brand" href="./" aria-label="Caravana, inicio">
        <svg class="brand-van" viewBox="0 0 48 32" aria-hidden="true">
          <path class="van-body" d="M3 25V9a5 5 0 0 1 5-5h22l11 9v12z"/>
          <path class="van-window" d="M30 7h-3v6h11z"/>
          <rect class="van-window" x="9" y="8" width="6" height="5" rx="1"/>
          <rect class="van-window" x="18" y="8" width="6" height="5" rx="1"/>
          <path class="van-stripe" d="M3 18h38"/>
          <circle class="van-wheel" cx="12" cy="25" r="4"/>
          <circle class="van-wheel" cx="33" cy="25" r="4"/>
        </svg>
        <span>Caravana</span>
      </a>

      <h1 class="hero-title">¿Dónde dormimos esta noche?</h1>
      <p class="hero-sub"><strong id="statTotal">—</strong> áreas, parkings y puntos de vaciado en toda España</p>

      <div class="hero-tools">
        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Busca un pueblo, una ciudad o una zona…" aria-label="Buscar localidad" aria-controls="searchResults" aria-expanded="false">
          <ul id="searchResults" class="search-results" role="listbox" hidden></ul>
        </form>
        <button type="button" class="btn btn-locate" data-action="locate" title="Mostrar los sitios más cercanos a ti">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 19-9-9 19-2-8-8-2z"/></svg>
          <span>Cerca de mí</span>
        </button>
      </div>
    </div>

    <div class="theme-switch" role="radiogroup" aria-label="Estilo de la web">
      <span class="theme-switch-label">Estilo</span>
      <button type="button" role="radio" data-action="theme" data-theme="roadtrip" aria-checked="true">Road trip</button>
      <button type="button" role="radio" data-action="theme" data-theme="nav" aria-checked="false">Navegación</button>
      <button type="button" role="radio" data-action="theme" data-theme="nature" aria-checked="false">Naturaleza</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel" id="panel" aria-label="Filtros y resultados">
      <div class="panel-handle" data-action="toggle-panel" aria-hidden="true"></div>

      <section class="filters" aria-label="Filtros">
        <div class="chips" id="kindFilters" role="group" aria-label="Tipo de sitio"></div>
        <div class="chips chips-services" id="serviceFilters" role="group" aria-label="Servicios"></div>
      </section>

      <section class="results" aria-live="polite">
        <header class="results-head">
          <h2 id="resultsTitle">Sitios en el mapa</h2>
          <p id="resultsCount" class="muted"></p>
        </header>
        <ol id="resultsList" class="results-list"></ol>
      </section>

      <article id="detail" class="detail" hidden aria-live="polite"></article>
    </aside>

    <div id="map" class="map" role="region" aria-label="Mapa de sitios"></div>
  </main>

  <footer class="credits">
    Datos © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores de OpenStreetMap</a> (ODbL) · actualizados <span id="dataDate">—</span> ·
    <a href="https://github.com/alex981110/caravana" target="_blank" rel="noopener">código en GitHub</a>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
